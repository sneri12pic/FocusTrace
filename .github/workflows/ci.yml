name: CI

on:
  # Every branch, so feature work is validated before a pull request exists.
  push:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-quality:
    name: Flutter quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  backend-build:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # No gradle-version: the server build runs its own wrapper (Gradle 9.5.1).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Integration tests start PostgreSQL through Testcontainers on the runner's
      # Docker; no service container. gradlew is tracked without the executable bit.
      - name: Build and test
        run: bash ./gradlew build --no-daemon --stacktrace

  android-build:
    name: Android tests, lint, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"

      - name: Install dependencies
        run: flutter pub get

      - name: Run Android unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        working-directory: android
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: focustrace-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  # Swift sources and the Xcode project (edited from Windows/Linux via
  # tool/ios/add_extension_targets.rb) are only ever compiled here.
  ios-build:
    name: iOS debug build (no codesign)
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app and extensions
        run: flutter build ios --debug --no-codesign

      # flutter build hides xcodebuild output, so prove the extensions were
      # built, embedded where iOS looks for them, and do not link Flutter.
      - name: Check embedded extensions
        run: |
          app=build/ios/iphoneos/Runner.app
          for ext in PlugIns/FocusTraceMonitor PlugIns/FocusTraceShield \
                     PlugIns/FocusTraceShieldAction Extensions/FocusTraceReport; do
            bundle="$app/$ext.appex"
            name=$(basename "$ext")
            test -f "$bundle/$name" || { echo "::error::missing $bundle/$name"; exit 1; }
            plutil -p "$bundle/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|PointIdentifier'
            if otool -L "$bundle/$name" | grep -q Flutter; then
              echo "::error::$name links Flutter"; exit 1
            fi
          done
