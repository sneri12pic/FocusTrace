name: CI

on:
  # Every branch, so feature work is validated before a pull request exists.
  push:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-quality:
    name: Flutter quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  backend-build:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # No gradle-version: the server build runs its own wrapper (Gradle 9.5.1).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Integration tests start PostgreSQL through Testcontainers on the runner's
      # Docker; no service container. gradlew is tracked without the executable bit.
      - name: Build and test
        run: bash ./gradlew build --no-daemon --stacktrace

  android-build:
    name: Android tests, lint, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"

      - name: Install dependencies
        run: flutter pub get

      - name: Run Android unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        working-directory: android
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: focustrace-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  # Swift sources and the Xcode project (edited from Windows/Linux via
  # tool/ios/add_extension_targets.rb) are only ever compiled here.
  ios-build:
    name: iOS debug build (no codesign)
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app and extensions
        run: flutter build ios --debug --no-codesign

      # flutter build hides xcodebuild output, so prove the extensions were
      # built, embedded, declare the expected extension point and do not link
      # Flutter (also inside an Xcode 16 <Name>.debug.dylib).
      - name: Check embedded extensions (Debug)
        run: bash tool/ios/check_embedded_extensions.sh build/ios/iphoneos/Runner.app

      # Release is what TestFlight archives: whole-module optimization, no
      # debug dylib split, dead-code stripping. Same job, so pub, Pods and
      # Xcode's derived data of the Debug build are reused.
      - name: Build iOS app and extensions (Release)
        run: flutter build ios --release --no-codesign

      - name: Check embedded extensions (Release)
        run: bash tool/ios/check_embedded_extensions.sh build/ios/iphoneos/Runner.app

      # Pure-Foundation FocusTraceKit logic (rule JSON from Dart, change guard,
      # schedule mapping) compiled with swiftc and run on the macOS host. Runs
      # even when the app build failed, so both kinds of error show at once.
      - name: FocusTraceKit unit tests
        if: ${{ !cancelled() }}
        run: bash tool/ios/run_kit_tests.sh
