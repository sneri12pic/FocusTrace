name: CI

on:
  # Every branch, so feature work is validated before a pull request exists.
  push:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-quality:
    name: Flutter quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  backend-build:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # No gradle-version: the server build runs its own wrapper (Gradle 9.5.1).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Integration tests start PostgreSQL through Testcontainers on the runner's
      # Docker; no service container. gradlew is tracked without the executable bit.
      - name: Build and test
        run: bash ./gradlew build --no-daemon --stacktrace

  android-build:
    name: Android tests, lint, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"

      - name: Install dependencies
        run: flutter pub get

      - name: Run Android unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        working-directory: android
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: focustrace-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  # Swift sources and the Xcode project (edited from Windows/Linux via
  # tool/ios/add_extension_targets.rb) are only ever compiled here.
  ios-build:
    name: iOS debug build (no codesign)
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app and extensions
        run: flutter build ios --debug --no-codesign

      # flutter build hides xcodebuild output, so prove the extensions were
      # built, embedded where iOS looks for them, declare the expected
      # extension point, and do not link Flutter. Xcode 16 debug builds may
      # move the code into <Name>.debug.dylib (ENABLE_DEBUG_DYLIB), so every
      # Mach-O file in the bundle is checked, not only the main binary.
      - name: Check embedded extensions
        run: |
          app=build/ios/iphoneos/Runner.app
          while read -r ext key expected; do
            bundle="$app/$ext.appex"
            name=$(basename "$ext")
            test -f "$bundle/$name" || { echo "::error::missing $bundle/$name"; exit 1; }
            plutil -p "$bundle/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString'
            point=$(plutil -extract "$key" raw -o - "$bundle/Info.plist") \
              || { echo "::error::$name has no $key"; exit 1; }
            echo "$name $key = $point"
            if [ "$point" != "$expected" ]; then
              echo "::error::$name declares $point, expected $expected"; exit 1
            fi
            checked=0
            for bin in "$bundle"/*; do
              [ -f "$bin" ] && file -b "$bin" | grep -q Mach-O || continue
              checked=$((checked + 1))
              echo "  $(basename "$bin")"
              if otool -L "$bin" | grep -q Flutter; then
                echo "::error::$(basename "$bin") in $name links Flutter"; exit 1
              fi
            done
            [ "$checked" -gt 0 ] || { echo "::error::no Mach-O file in $bundle"; exit 1; }
          done <<'EOF'
          PlugIns/FocusTraceMonitor NSExtension.NSExtensionPointIdentifier com.apple.deviceactivity.monitor-extension
          PlugIns/FocusTraceShield NSExtension.NSExtensionPointIdentifier com.apple.ManagedSettingsUI.shield-configuration-service
          PlugIns/FocusTraceShieldAction NSExtension.NSExtensionPointIdentifier com.apple.ManagedSettings.shield-action-service
          Extensions/FocusTraceReport EXAppExtensionAttributes.EXExtensionPointIdentifier com.apple.deviceactivityui.report-extension
          EOF

      # Pure-Foundation FocusTraceKit logic (rule JSON from Dart, change guard,
      # schedule mapping) compiled with swiftc and run on the macOS host. Runs
      # even when the app build failed, so both kinds of error show at once.
      - name: FocusTraceKit unit tests
        if: ${{ !cancelled() }}
        run: bash tool/ios/run_kit_tests.sh
