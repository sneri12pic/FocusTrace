name: iOS TestFlight

# Manual only: builds a signed Release archive and uploads it to App Store
# Connect for TestFlight. Nothing runs on push, so CI is unaffected while the
# secrets below do not exist. See docs/ios/ios-release-checklist.md.
#
# Secrets (repository settings, none committed):
#   APPLE_TEAM_ID                 10-character Apple Developer team id
#   ASC_KEY_ID                    App Store Connect API key id (Admin or App Manager)
#   ASC_ISSUER_ID                 App Store Connect API issuer id
#   ASC_KEY_P8_BASE64             the key's .p8 file, base64-encoded
#
# Signing is automatic (Xcode creates or downloads certificates and profiles
# through the API key), so the App IDs, the App Group and the Family Controls
# (Distribution) entitlement must already exist for every bundle id.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion (defaults to the pubspec build number)"
        required: false

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (docs/ios/ios-release-checklist.md)"
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Write the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Generates Flutter/Generated.xcconfig (version and build number from
      # pubspec.yaml) and the Release Flutter framework.
      - name: Prepare the Flutter build
        env:
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          args=(--release --no-codesign)
          if [ -n "$BUILD_NUMBER" ]; then args+=(--build-number "$BUILD_NUMBER"); fi
          flutter build ios "${args[@]}"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FocusTrace.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

      - name: Export and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :destination string upload" \
            -c "Add :signingStyle string automatic" \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            "$options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FocusTrace.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
