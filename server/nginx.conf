worker_processes 1;
events { worker_connections 256; }
http {
    server_tokens off;
    # cloudflared is the only network ingress to this loopback listener.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    limit_req_zone $binary_remote_addr zone=source:1m rate=10r/s;
    limit_req_zone $server_name zone=total:1m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    # No body, authorization, cookies, query string, or user-agent in access logs.
    log_format safe '$time_iso8601 $remote_addr $request_method $uri $status';
    access_log /var/log/nginx/access.log safe;
    error_log /var/log/nginx/error.log warn;
    server {
        listen 127.0.0.1:18081;
        server_name staging-sync.stepandemianenko.dev;
        if ($host != staging-sync.stepandemianenko.dev) { return 421; }
        # Missing/invalid visitor header must not collapse every source into localhost.
        if ($remote_addr = 127.0.0.1) { return 400; }
        if ($http_x_forwarded_proto != https) {
            return 308 https://staging-sync.stepandemianenko.dev$request_uri;
        }
        client_max_body_size 2m;
        client_body_timeout 10s;
        client_header_timeout 10s;
        keepalive_timeout 15s;
        limit_req zone=source burst=30 nodelay;
        limit_req zone=total burst=60 nodelay;
        limit_req_status 429;
        limit_conn connections 20;
        limit_conn_status 429;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        location /api/v1/ {
            proxy_pass http://127.0.0.1:18080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        location / { return 404; }
    }
}
